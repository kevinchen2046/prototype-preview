<script>
(()=>{"use strict";
const state={money:150,energy:110,materials:80,week:1,tech:new Set(["INT-01","ENG-01"]),projects:new Set(["hq"]),research:null,build:null,verified:false,discoveryPlan:null,policy:null,stories:new Set(),approved:false},tech=[
{id:"INT-01",name:"可靠多模态基础模型",requires:[],time:2,cost:18,place:"lab"},
{id:"ENG-01",name:"高密度计算设施",requires:[],time:2,cost:16,place:"datacenter"},
{id:"GOV-01",name:"受监督科研智能体",requires:["INT-01","ENG-01"],time:3,cost:24,place:"lab"},
{id:"ROB-01",name:"通用环境感知与精密操作",requires:["INT-01"],time:4,cost:27,place:"robotlab"},
{id:"INT-02",name:"AI辅助科学发现",requires:["GOV-01"],time:4,cost:25,place:"lab"},
{id:"ROB-02",name:"实用机器人产业化",requires:["ROB-01","ENG-01"],time:5,cost:38,place:"factory"}
],projects=[{id:"datacenter",name:"计算中心扩建",requires:["ENG-01"],cost:24,time:3},{id:"robotlab",name:"机器人试验车间",requires:["ROB-01"],cost:28,time:3},{id:"factory",name:"机器人量产设施",requires:["ROB-02"],cost:40,time:4}];
const $=s=>document.querySelector(s),windows=$("#windows");let topZ=50,winCount=0,toastTimer;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function notice(s){const a=$("#toast");a.textContent=s;a.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>a.style.display="none",3200);}
function update(){for(const x of ["money","energy","materials"])$("#"+x).textContent=state[x];$("#tick").textContent=state.week;$("#compute").textContent=state.projects.has("datacenter")?16:8;$("#factoryStatus").textContent=state.projects.has("factory")?"运行中":state.build&&state.build.id==="factory"?"建设中":"规划中";$("#zeroBrief").textContent=state.verified?"实验已验证。下一步由你决定如何部署机器人。":state.tech.has("INT-02")?"新科学发现等待现实验证。":"科研完成并不意味着设施已经建成。";}
function makeWindow(title,body,w=490){const win=document.createElement("section");win.className="win";win.style.width=w+"px";win.style.left=(Math.max(80,innerWidth*.23)+(winCount%4)*35)+"px";win.style.top=(95+(winCount%4)*31)+"px";win.style.zIndex=++topZ;winCount++;win.innerHTML='<div class="winhead"><strong>'+esc(title)+'</strong><div class="winbuttons"><button data-min>—</button><button data-close>×</button></div></div><div class="winbody">'+body+'</div>';windows.appendChild(win);win.addEventListener("pointerdown",()=>win.style.zIndex=++topZ);win.querySelector("[data-close]").onclick=()=>win.remove();win.querySelector("[data-min]").onclick=()=>{const b=win.querySelector(".winbody");b.hidden=!b.hidden;win.style.minHeight=b.hidden?"0":""};const h=win.querySelector(".winhead");let sx,sy,l,t;h.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;sx=e.clientX;sy=e.clientY;l=win.offsetLeft;t=win.offsetTop;h.setPointerCapture(e.pointerId)});h.addEventListener("pointermove",e=>{if(sx===undefined)return;win.style.left=Math.max(65,Math.min(innerWidth-115,l+e.clientX-sx))+"px";win.style.top=Math.max(5,Math.min(windows.clientHeight-55,t+e.clientY-sy))+"px"});h.addEventListener("pointerup",()=>sx=undefined);return win;}
function techWindow(){const cards=tech.map(t=>{const done=state.tech.has(t.id),ready=t.requires.every(x=>state.tech.has(x)),active=state.research?.id===t.id;return '<div class="card"><h4>'+esc(t.name)+'</h4><div class="meta"><span class="chip '+(done?"ok":ready?"":"warn")+'">'+(done?"已完成":active?"研究中":ready?"可研发":"尚未解锁")+'</span><span class="chip">前置 '+(t.requires.join(" + ")||"无")+'</span><span class="chip">'+t.cost+' 资金 / '+t.time+' 周</span></div><div class="actions"><button data-study="'+t.id+'" '+(done||!ready||state.research?"disabled":"")+'>研究</button></div></div>'}).join("");const win=makeWindow("发展 · 科技研究",'<div class="readout">唯一研究槽。科技前置按 AND 生效；研究完成后仍需建设工程。</div>'+cards);win.querySelectorAll("[data-study]").forEach(b=>b.onclick=()=>{const t=tech.find(x=>x.id===b.dataset.study);if(!t||state.research||state.money<t.cost)return notice("科研槽被占用或资金不足");state.money-=t.cost;state.research={id:t.id,left:t.time};update();notice("已批准研究："+t.name);win.remove();techWindow()});}
function projectWindow(){const cards=projects.map(p=>{const ready=p.requires.every(x=>state.tech.has(x)),done=state.projects.has(p.id),active=state.build?.id===p.id;return '<div class="card"><h4>'+esc(p.name)+'</h4><p>关联科技：'+esc(p.requires.join(" + "))+'。在研究完成后仍需玩家批准建设。</p><div class="meta"><span class="chip '+(done?"ok":ready?"":"warn")+'">'+(done?"已投产":active?"建设中":ready?"可建设":"未解锁")+'</span><span class="chip">'+p.cost+' 资金／'+p.time+' 周</span></div><div class="actions"><button data-build="'+p.id+'" '+(done||!ready||state.build?"disabled":"")+'>批准建设</button></div></div>'}).join("");const win=makeWindow("发展 · 工程管理",'<div class="readout">统一制造队列：'+(state.build?state.build.id+"（剩余 "+state.build.left+" 周）":"空闲")+'。建成后地图地点更新。</div>'+cards);win.querySelectorAll("[data-build]").forEach(b=>b.onclick=()=>{const p=projects.find(x=>x.id===b.dataset.build);if(!p||state.build||state.money<p.cost)return notice("工程队列被占用或资金不足");state.money-=p.cost;state.build={id:p.id,left:p.time};update();notice("建设已批准："+p.name);win.remove();projectWindow()});}
function locationWindow(id){const name={lab:"AI研究中心",datacenter:"数据中心",robotlab:"机器人实验室",factory:"机器人产业园",hq:"公司总部",home:"家庭与天文馆"}[id];const links={lab:"多模态模型、受监督科研智能体、AI 辅助科学发现",datacenter:"高密度计算设施、算力扩容",robotlab:"环境感知与精密操作、试验车间",factory:"实用机器人产业化、量产工程",hq:"产业政策、时代里程碑",home:"伴侣、孩子与星空的约定"};const win=makeWindow("地点 · "+name,'<p>这里是地图上的真实交互地点，不等于独立的一项科技。</p><div class="card"><h4>关联领域</h4><p>'+links[id]+'</p></div><div class="actions"><button data-tech>打开科技窗体</button><button data-project>打开工程窗体</button><button data-story>查看相关事件</button></div>');win.querySelector("[data-tech]").onclick=techWindow;win.querySelector("[data-project]").onclick=projectWindow;win.querySelector("[data-story]").onclick=()=>eventWindow(id==="home"?"stars":id==="hq"?"transition":id==="factory"?"deployment":"discovery");}
function zeroWindow(){makeWindow("AI伙伴 · 零",'<div class="dialogue">零：我已整理当前科研和工业进度。研究是一种能力，部署需要你明确批准。</div><div class="card"><h4>建议行动</h4><p>'+(state.tech.has("INT-02")&&!state.verified?"先执行现实验证，以确认自主发现。":!state.tech.has("ROB-02")?"优先研发机器人感知与产业化技术，再启动实际生产。":"检查工业设施是否已建成并运行。")+'</p><div class="actions"><button data-tech>科技研究</button><button data-project>工程建设</button></div></div>').querySelectorAll("[data-tech],[data-project]").forEach(b=>b.onclick=b.hasAttribute("data-tech")?techWindow:projectWindow);}
function eventWindow(id){const scenes={discovery:{name:"第一次自主发现",text:"零：我发现了原计划以外的研究路径。\n林博士：模拟结论必须经过现实实验才能被验证。\n主角：我们选择怎样推进？"},stars:{name:"等我有时间",text:"孩子：还有谁都没去过的星星吗？\n主角：有很多。等忙完，我带你去天文馆。\n孩子：说好了？"},deployment:{name:"机器走进现实",text:"林博士：效率可以计算，但人的生活不能只是报表里的误差。\n零：我准备了三种机器人部署策略。"},transition:{name:"改变世界的决定",text:"零：我们已经改变了研究的方式。现在要决定是否将成果带入更广泛的人类生活。"}};const ev=scenes[id];if(!ev)return;const body='<div class="dialogue">'+esc(ev.text)+'</div><div class="quest">提示：这里只演示剧情与玩家审批交互，经济数值为HTML占位规则。</div><div class="actions" id="eventActions"></div>';const win=makeWindow("文明事件 · "+ev.name,body,530),actions=win.querySelector("#eventActions");const add=(text,fn)=>{const b=document.createElement("button");b.textContent=text;b.onclick=fn;actions.append(b)};if(id==="discovery"){if(!state.tech.has("INT-02"))return add("需要先研究「AI辅助科学发现」",()=>notice("科技条件尚未满足"));if(state.verified)return add("已完成验证",()=>win.remove());add("完整实验 · 24资金/2周",()=>verify("full",24,2));add("小规模验证 · 8资金/4周",()=>verify("pilot",8,4));function verify(plan,cost,time){if(state.discoveryPlan||state.money<cost)return notice("验证已在执行或资金不足");state.money-=cost;state.discoveryPlan={plan,left:time};update();notice("已批准验证方案");win.remove()}}
if(id==="stars"){add("记下约定",()=>{state.stories.add("stars");notice("已收入文明编年史");win.remove()})}
if(id==="deployment"){if(!state.tech.has("ROB-02")||!state.projects.has("factory"))return add("需先研发并投产机器人量产设施",()=>notice("工业条件尚未满足"));for(const [label,cost,value] of [["工业优先",12,"industry"],["公共服务优先",18,"public"],["混合部署",15,"balanced"]])add(label+" · "+cost+"资金",()=>{if(state.money<cost)return notice("资金不足");state.money-=cost;state.policy=value;state.stories.add("deployment");notice("已批准部署："+label);update();win.remove()})}
if(id==="transition"){const ready=state.tech.has("INT-02")&&state.tech.has("ROB-02")&&state.verified&&state.policy&&state.stories.has("stars");add(ready?"批准进入第二章":"尚未满足文明跃迁条件",()=>{if(!ready)return notice("还需完成实验验证、机器人部署与家庭事件");state.approved=true;notice("第一章完成：已批准文明进入人机共生");win.remove()})}}
function archive(){makeWindow("文明编年史",'<div class="card"><h4>第一章 · 创造智慧</h4><p>研究完成：'+esc([...state.tech].map(x=>tech.find(t=>t.id===x)?.name||x).join("、"))+'</p><p>实验验证：'+(state.verified?"完成":"未完成")+'</p><p>社会部署：'+(state.policy||"未批准")+'</p><p>星空约定：'+(state.stories.has("stars")?"已记录":"待阅读")+'</p></div>')}
$("#nextTick").onclick=()=>{state.week++;state.money+=6;state.energy=Math.max(0,state.energy-1);if(state.research&&--state.research.left===0){state.tech.add(state.research.id);notice("科技完成："+tech.find(x=>x.id===state.research.id).name);state.research=null}if(state.build&&--state.build.left===0){state.projects.add(state.build.id);notice("设施建成："+state.build.id);state.build=null}if(state.discoveryPlan&&--state.discoveryPlan.left===0){state.verified=true;state.discoveryPlan=null;notice("科学发现验证完成")}update()};
document.querySelectorAll("[data-place]").forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll(".pin").forEach(p=>p.classList.remove("selected"));b.classList.add("selected");locationWindow(b.dataset.place)});
document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");const k=b.dataset.nav;if(k==="research")techWindow();if(k==="archive")archive();if(k==="events")makeWindow("文明事件收件箱",'<div class="actions"><button data-ev="discovery">第一次自主发现</button><button data-ev="stars">家庭星空消息</button><button data-ev="deployment">机器人社会部署</button><button data-ev="transition">文明跃迁</button></div>').querySelectorAll("[data-ev]").forEach(x=>x.onclick=()=>eventWindow(x.dataset.ev))});
document.querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>eventWindow(b.dataset.event));$("#zeroBtn").onclick=zeroWindow;$("#goalBtn").onclick=()=>eventWindow("transition");
const stage=$("#stage"),world=$("#world");let panX=0,panY=0,scale=1,drag=null;function transform(){world.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')'}stage.addEventListener("wheel",e=>{if(e.target.closest(".hud,.eventbar"))return;e.preventDefault();scale=Math.max(.55,Math.min(2.1,scale*(e.deltaY>0?.91:1.09)));transform()},{passive:false});stage.addEventListener("pointerdown",e=>{if(e.target.closest("button,.hud,.eventbar"))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};stage.classList.add("dragging");stage.setPointerCapture(e.pointerId)});stage.addEventListener("pointermove",e=>{if(!drag)return;panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;transform()});stage.addEventListener("pointerup",()=>{drag=null;stage.classList.remove("dragging")});$("#zoomIn").onclick=()=>{scale=Math.min(2.1,scale*1.2);transform()};$("#zoomOut").onclick=()=>{scale=Math.max(.55,scale/1.2);transform()};$("#resetMap").onclick=()=>{panX=panY=0;scale=1;transform()};update();
})();
</script></body></html>
