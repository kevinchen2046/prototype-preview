<script>
(()=>{'use strict';

class Party extends Phaser.Scene{

for(const [key,path] of assets){const response=await fetch('assets/'+path,{cache:'no-store'});if(!response.ok)throw new Error(path+' HTTP '+response.status);const svg=await response.text();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error(path+' SVG 解码失败'));img.src=url;});const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,256,256);ctx.drawImage(img,0,0,256,256);if(this.textures.exists(key))this.textures.remove(key);this.textures.addCanvas(key,canvas);}finally{URL.revokeObjectURL(url);}}

startAudio(){
try{if(!this.audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.audio=new C();this.master=this.audio.createGain();this.master.gain.value=.62;this.master.connect(this.audio.destination);this.noiseBuffer=this.audio.createBuffer(1,Math.floor(this.audio.sampleRate*.5),this.audio.sampleRate);const data=this.noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;}if(this.audio.state==='suspended')this.audio.resume();this.nextStep=this.audio.currentTime+.08;this.stepIndex=0;}catch(e){}
}
envGain(g,t,peak,duration){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+duration);}
playKick(t,accent){

const b=this.audio.createOscillator(),bg=this.audio.createGain();b.type='triangle';b.frequency.setValueAtTime([55,65.4,73.4,49][Math.floor(this.stepIndex/2)%4],t);this.envGain(bg,t,accent?.12:.075,.23);b.connect(bg);bg.connect(this.master);b.start(t);b.stop(t+.25);
}
playNoise(t,peak,duration,filterType,frequency){

playHat(t){this.playNoise(t,.045,.035,'highpass',7200);}

onBeat(){

const color=COLORS[Math.max(0,Math.min(8,this.stage))]||0xffdf61;
const ring=this.add.circle(210,460,64,0xffffff,0.001).setStrokeStyle(this.beatNo%4===1?5:3,color,this.beatNo%4===1?.9:.55);this.track(ring);

stageShake(){
this.vampireSprite=this.image('vampire',210,417,178,194,4);this.txt(210,556,'Z  z  z  …',26,'#c3b1ff');this.txt(210,600,'吸血鬼的闹钟坏了。',14,'#b8c2e5',.5,'normal');
this.button(210,675,252,58,'启用摇晃传感器',()=>this.enableMotion(),0x5b4b9b);
this.button(210,746,252,52,'桌面模拟摇动',()=>this.shakeHit(),0x247e8a);
}
stageShout(){
this.image('shout',210,398,190,200,-3);this.addGlow(210,408,125,0xffd84d,.11);
this.txt(210,554,'啊啊啊啊啊——！',23,'#ffdf61');
this.button(210,645,252,58,'开启麦克风',()=>this.enableMic(),0x5b4b9b);
this.button(210,716,252,54,'桌面模拟尖叫',()=>this.shoutHit(),0x247e8a);
this.txt(210,785,'麦克风只在授权后启用',12,'#8e9bc6',.5,'normal');
}
onDown(p){
if(this.stage===2){this.bossTap();return;}
if(this.stage===4&&p.y>680&&p.y<790){this.holding=true;this.holdMs=0;return;}
if(this.stage===5){this.swipeStart={x:p.x,y:p.y,t:this.time.now};return;}
if(this.stage===6){if(p.x<205)this.pad.left=this.time.now;else if(p.x>215)this.pad.right=this.time.now;this.checkPads();return;}
}
onUp(p){
if(this.stage===4&&this.holding){this.holding=false;const v=(this.holdMs%1500)/1500;this.actionResult(v>=.44&&v<=.64,v>=.44&&v<=.64?'喷嚏憋回去了！全场鼓掌。':'喷嚏爆发！老奶奶震碎了节拍。');return;}
if(this.stage===5&&this.swipeStart){const dx=p.x-this.swipeStart.x,dy=p.y-this.swipeStart.y,dt=this.time.now-this.swipeStart.t;const dir=dx<0?-1:1,good=Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.15&&dt<550&&dir===this.swipeDir;this.swipeStart=null;if(good){this.actionSuccess('披萨回旋！外卖员开始怀疑人生。');this.swipeDir*=-1;this.updateSwipePrompt();if(this.pizza&&this.pizza.active){this.tweens.add({targets:this.pizza,x:this.swipeDir<0?310:110,angle:this.pizza.angle+180,duration:180,yoyo:true,onComplete:()=>{if(this.pizza&&this.pizza.active)this.pizza.setPosition(210,475);}});}}else this.actionMiss('方向不对，或者不够快！');}
}
bossTap(){if(this.bossAlert){this.actionSuccess('装忙成功！你刚刚合上了 47 个表格。');this.bossAlert=false;this.bossNextAt=this.elapsed+500;}else this.actionMiss('你在老板没来时就开始演了。');}
checkPads(){if(this.pad.left!==null&&this.pad.right!==null&&Math.abs(this.pad.left-this.pad.right)<260){this.actionSuccess('双喷射器同时点火！超人进入低轨道。');this.pad={left:null,right:null};if(this.leftPad)this.leftPad.setFillStyle(0x2a9dbd);if(this.rightPad)this.rightPad.setFillStyle(0x8254bb);}else if(this.pad.left!==null&&this.pad.right!==null){this.actionMiss('要同时按下！再来一次。');this.pad={left:null,right:null};}}
actionSuccess(msg){
this.hitCount++;this.combo++;this.best=Math.max(this.best,this.combo);this.score+=100+Math.min(100,this.combo*8);if(this.hitText)this.hitText.setText('命中 '+Math.min(this.hitCount,this.goal)+' / '+this.goal+(this.hitCount>=this.goal?'  ✓':''));
this.feedback(msg,true);for(let i=0;i<9;i++){const a=(Math.PI*2*i/9)+Math.random()*.2,dist=Phaser.Math.Between(36,88),dot=this.track(this.add.circle(210,440,Phaser.Math.Between(3,6),COLORS[Math.max(0,Math.min(8,this.stage))],1));this.tweens.add({targets:dot,x:210+Math.cos(a)*dist,y:440+Math.sin(a)*dist,alpha:0,scale:.2,duration:360,ease:'Quad.Out',onComplete:()=>dot.destroy()});}
}
actionResult(ok,msg){if(ok)this.actionSuccess(msg);else this.actionMiss(msg);}
actionMiss(msg){this.combo=0;if(this.hitText)this.hitText.setText('命中 '+Math.min(this.hitCount,this.goal)+' / '+this.goal);if(this.time.now-this.lastWrong>450){this.feedback(msg,false);this.lastWrong=this.time.now;}}
feedback(msg,good){if(this.feedbackText&&this.feedbackText.active)this.feedbackText.destroy();const f=this.txt(210,810,msg,14,good?'#63f5c8':'#ff9eaf');this.feedbackText=f;this.time.delayedCall(850,()=>{if(f&&f.active)f.destroy();});}
onMotion(e){
if(this.stage!==7)return;const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const v=[a.x||0,a.y||0,a.z||0];if(this.motionPrev){const d=Math.abs(v[0]-this.motionPrev[0])+Math.abs(v[1]-this.motionPrev[1])+Math.abs(v[2]-this.motionPrev[2]);if(d>19&&this.time.now-this.lastShakeAt>650){this.lastShakeAt=this.time.now;this.shakeHit();}}this.motionPrev=v;
}
enableMotion(){try{const D=window.DeviceMotionEvent;if(D&&typeof D.requestPermission==='function')D.requestPermission().then(s=>{if(s==='granted')this.feedback('传感器已启用，摇一摇！',true);else this.feedback('没有获得权限，可用模拟按钮。',false);}).catch(()=>this.feedback('传感器不可用，可用模拟按钮。',false));else this.feedback('现在摇动手机试试！',true);}catch(e){this.feedback('传感器不可用，可用模拟按钮。',false);}}
shakeHit(){if(this.stage===7){this.actionSuccess('醒了！吸血鬼要求赔偿他的美梦。');if(this.vampireSprite)this.vampireSprite.setAngle(Phaser.Math.Between(-18,18));}}
async enableMic(){
try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('unsupported');const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(this.stage!==8){stream.getTracks().forEach(t=>t.stop());return;}const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),source=ctx.createMediaStreamSource(stream),analyser=ctx.createAnalyser();analyser.fftSize=256;source.connect(analyser);this.mic={stream,ctx,analyser};this.micData=new Uint8Array(analyser.fftSize);this.feedback('麦克风已开启，大喊一声！',true);}catch(e){this.feedback('麦克风不可用，可点模拟尖叫。',false);}
}
shoutHit(){if(this.stage===8&&this.time.now-this.lastShoutAt>550){this.lastShoutAt=this.time.now;this.actionSuccess('音量爆表！超人突破了大气层。');}}
update(_,delta){
if(this.stage>=0&&this.stage<LEVELS.length&&!this.stageFinished){
this.elapsed+=delta;const left=Math.max(0,this.duration-this.elapsed);if(this.timeText)this.timeText.setText((left/1000).toFixed(1)+'s');if(this.progress)this.progress.width=350*(1-left/this.duration);
if(this.beatDots){const idx=(this.beatNo||0)%4;this.beatDots.forEach((d,j)=>{d.setFillStyle(j===idx?COLORS[this.stage]:0x5b6284,j===idx?1:.45);if(j===idx)d.setScale(1.25);else d.setScale(1);});}
if(this.stage===2){const phase=this.elapsed%2200,alert=phase<820;if(alert!==this.bossAlert){this.bossAlert=alert;if(this.bossSprite)this.bossSprite.setVisible(alert);if(this.alertText)this.alertText.setText(alert?'🚨 老板出现！快装忙！':'☕ 老板走了，继续摸鱼');if(this.alertText)this.alertText.setColor(alert?'#ff668c':'#9fb1d8');}}
if(this.holding){this.holdMs+=delta;const v=(this.holdMs%1500)/1500;if(this.holdMarker)this.holdMarker.x=70+280*v;}
if(this.stage===6&&this.keys.A.isDown&&this.keys.L.isDown&&!this.keyboardDoubleLatched){this.keyboardDoubleLatched=true;this.actionSuccess('双喷射器同时点火！');this.pad={left:null,right:null};}if(!this.keys.A.isDown||!this.keys.L.isDown)this.keyboardDoubleLatched=false;
if(this.stage===8&&this.mic&&this.time.now-this.lastShoutAt>600){this.mic.analyser.getByteTimeDomainData(this.micData);let sum=0;for(let i=0;i<this.micData.length;i++){const n=(this.micData[i]-128)/128;sum+=n*n;}if(Math.sqrt(sum/this.micData.length)>.2)this.shoutHit();}
if(left<=0){this.stageFinished=true;this.feedback(this.hitCount>=this.goal?'漂亮！目标完成，下一关更疯。':'时间到！下一关换种操作。',this.hitCount>=this.goal);this.time.delayedCall(650,()=>this.startStage(this.stage+1));}
}
if(this.audio&&this.stage>=0&&this.stage<LEVELS.length){const bpm=LEVELS[this.stage].bpm,step=30/bpm;while(this.audio.currentTime>=this.nextStep){const t=this.nextStep;if(this.stepIndex%2===0){this.onBeat();const beat=Math.floor(this.stepIndex/2)%4;if(beat===0||beat===2)this.playKick(t,beat===0);else this.playSnare(t);}this.playHat(t);this.stepIndex++;this.nextStep+=step;}}
}
showResults(){
this.clearObjects();this.stage=9;this.drawStageDecor(8);this.txt(210,100,'你活着闯过了！',33,'#ffdf61');this.image('hero',210,280,180,188,-5);this.txt(210,433,'总分  '+this.score,28,'#ffffff');this.txt(210,477,'最佳连击  '+this.best,19,'#63f5c8');this.txt(210,535,'九种操作，九次社死。',16,'#c2c9e9',.5,'normal');this.button(210,645,260,60,'再来一局',()=>{this.startAudio();this.startRun();},0x7655e8);this.button(210,719,260,54,'返回标题',()=>this.showTitle(),0x247e8a);
}
}
const config={type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#0b0d20',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},render:{antialias:true,pixelArt:false,transparent:false},scene:[Party]};
new Phaser.Game(config);
})();
</script></body></html>
