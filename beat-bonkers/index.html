<script>
(()=>{'use strict';
const W=420,H=860;

{name:'披萨回旋镖',type:'快速滑动',desc:'看箭头方向，快速把飞来的披萨拍回去。',goal:2,seconds:6},

class Party extends Phaser.Scene{

create(){

this.input.on('pointerdown',p=>this.handleDown(p));this.input.on('pointerup',p=>this.handleUp(p));this.input.on('pointermove',p=>this.handleMove(p));

g.fillStyle(0x7a4cba,.10);g.fillCircle(20,230,190);g.fillStyle(0x20bcb7,.07);g.fillCircle(400,550,220);

async loadSprites(){

}
track(o){this.phaseObjects.push(o);return o;}

text(x,y,str,size=18,color='#fff',origin=.5,weight='bold'){return this.track(this.add.text(x,y,str,{fontFamily:'Inter,system-ui,Microsoft YaHei,sans-serif',fontSize:size+'px',fontStyle:weight,color,align:'center',wordWrap:{width:350},lineSpacing:4}).setOrigin(origin,.5));}

this.clearPhase();this.phase='title';
const glow=this.track(this.add.circle(210,300,165,0x7957e9,.15));this.tweens.add({targets:glow,scale:1.13,alpha:.08,duration:850,yoyo:true,repeat:-1});
this.image('heroFly',205,280,182,192,-8);this.image('fly',94,332,48,48,12);this.image('vampire',320,356,105,125,6);this.image('pizza',95,430,64,64,-16);this.image('helmet',325,468,62,52,12);

this.text(210,490,'一路坠落 · 倒挂攀爬 · 重力失控',17,'#fff');
this.text(210,527,'跑酷推进距离，荒诞小游戏突然打断！',14,'#c3c9e9',.5,'normal');
this.button(210,610,286,62,'开始失控跑酷',()=>{this.startAudio();this.startRun();},0x7655e8);
this.button(210,685,286,54,'练习一轮 · 快速预览',()=>{this.quick=true;this.startAudio();this.startRun();},0x247e8a);
this.text(210,771,'左右滑动换道 · 踩准鼓点点击冲刺',12,'#9ca8d1',.5,'normal');
}
startAudio(){
try{if(!this.audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.audio=new C();this.master=this.audio.createGain();this.master.gain.value=.55;this.master.connect(this.audio.destination);this.noiseBuffer=this.audio.createBuffer(1,Math.floor(this.audio.sampleRate*.5),this.audio.sampleRate);const d=this.noiseBuffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(this.audio.state==='suspended')this.audio.resume();this.nextStep=this.audio.currentTime+.08;this.stepIndex=0;}catch(e){}
}
envGain(g,t,peak,dur){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}

noise(t,peak,dur,type,freq){if(!this.audio||!this.noiseBuffer)return;const src=this.audio.createBufferSource(),filter=this.audio.createBiquadFilter(),g=this.audio.createGain();src.buffer=this.noiseBuffer;filter.type=type;filter.frequency.value=freq;this.envGain(g,t,peak,dur);src.connect(filter);filter.connect(g);g.connect(this.master);src.start(t);src.stop(t+dur+.02);}
snare(t){this.noise(t,.15,.12,'bandpass',1800);const o=this.audio.createOscillator(),g=this.audio.createGain();o.type='triangle';o.frequency.setValueAtTime(185,t);o.frequency.exponentialRampToValueAtTime(95,t+.08);this.envGain(g,t,.07,.1);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+.12);}
currentBpm(){return Math.min(152,112+Math.floor(this.distance/1200)*2);}
onBeat(){
this.lastBeatMs=this.time.now;this.beatNo++;
const c=COLORS[Math.min(8,Math.floor(this.distance/1900))];
if(this.phase==='run'&&this.player&&this.player.active){const ring=this.add.circle(this.player.x,this.player.y,42,0xffffff,.001).setStrokeStyle(3,c,.85).setDepth(30);this.tweens.add({targets:ring,scale:2.4,alpha:0,duration:300,onComplete:()=>ring.destroy()});}
const top=this.add.rectangle(210,6,W,12,c,.14).setDepth(50);this.tweens.add({targets:top,alpha:0,duration:160,onComplete:()=>top.destroy()});
if(this.hudBeatDots&&this.hudBeatDots.length){const k=this.beatNo%4;this.hudBeatDots.forEach((d,i)=>{d.setFillStyle(i===k?c:0x5a6285,i===k?1:.5);d.setScale(i===k?1.45:1);});}
if(this.phase==='mini'&&this.miniType===1&&this.miniHero&&this.miniHero.active){this.tweens.add({targets:this.miniHero,angle:this.miniHero.angle+7,duration:75,yoyo:true});}
}
startRun(){
this.quick=!!this.quick;this.distance=0;this.score=0;this.lives=3;this.combo=0;this.bestCombo=0;this.lane=1;this.modeIndex=0;this.minisCompleted=0;this.nextMiniAt=this.quick?650:1800;this.finishAt=0;this.invulnerableUntil=0;this.dashUntil=0;this.beatNo=0;this.lastBeatMs=this.time.now;this.previousLane=1;this.nextHazardDistance=250;this.startRunSegment(true);
}
modeForDistance(){return Math.floor(this.distance/2600)%3;}
modeInfo(i){return [{name:'自由坠落',short:'FALL',y:620,texture:'heroFly',angle:-8,dir:1},{name:'倒挂攀爬',short:'CLIMB',y:290,texture:'hero',angle:174,dir:-1},{name:'重力失控',short:'FLIP',y:450,texture:'heroFly',angle:180,dir:1}][i];}
startRunSegment(first){
this.clearPhase();this.phase='run';this.gesture=null;this.holding=false;this.padDown={left:null,right:null};this.padHeld={left:false,right:false};
this.modeIndex=this.modeForDistance();const mode=this.modeInfo(this.modeIndex);
const panel=this.track(this.add.graphics());panel.fillStyle(0x11152f,.72);panel.fillRoundedRect(18,190,384,520,28);panel.lineStyle(2,COLORS[this.modeIndex],.35);panel.strokeRoundedRect(18,190,384,520,28);
const rails=this.track(this.add.graphics());rails.lineStyle(2,COLORS[this.modeIndex],.23);rails.beginPath();rails.moveTo(67,225);rails.lineTo(67,680);rails.moveTo(353,225);rails.lineTo(353,680);rails.strokePath();
for(let i=0;i<12;i++){const x=[105,210,315][i%3]+Phaser.Math.Between(-17,17),y=Phaser.Math.Between(225,675);const st=this.track(this.add.rectangle(x,y,2,Phaser.Math.Between(20,52),COLORS[this.modeIndex],.22));this.streaks.push(st);}
this.player=this.image(mode.texture,[105,210,315][this.lane],mode.y,116,124,mode.angle);this.player.setDepth(12);
this.playerGlow=this.track(this.add.circle(this.player.x,this.player.y,60,COLORS[this.modeIndex],.09).setDepth(10));
this.hudDistance=this.text(28,31,'距离 000m',13,'#dce2ff',0);this.hudScore=this.text(210,31,'分数 '+this.score,13,'#ffdf61');this.hudLives=this.text(392,31,'♥ ♥ ♥',15,'#ff809f',1);
this.hudMode=this.text(210,76,mode.name,24,'#ffdf61');this.text(210,112,'左右滑动换道',12,'#c6cde9',.5,'normal');
this.text(210,145,'踩准鼓点点击 = 冲刺 / 清除近处障碍',12,'#8d9ac7',.5,'normal');
this.hudBeatDots=[];for(let i=0;i<4;i++)this.hudBeatDots.push(this.track(this.add.circle(171+i*26,173,5,0x5a6285,.55)));
this.text(210,742,'距离触发荒诞事件 · 失败会消耗生命',12,'#9ca8d1',.5,'normal');
this.track(this.add.rectangle(210,810,360,4,0x3b426a,.9));this.hudProgress=this.track(this.add.rectangle(30,810,0,4,0x69e3c0,1).setOrigin(0,.5));
this.modeSwitchAt=(Math.floor(this.distance/2600)+1)*2600;
if(first){this.nextHazardDistance=260;}else{this.nextHazardDistance=this.distance+280;}
}
switchMode(next){
if(next===this.modeIndex)return;this.modeIndex=next;const m=this.modeInfo(next);
for(const h of this.hazards){if(h.ring)h.ring.destroy();if(h.sprite)h.sprite.destroy();}this.hazards=[];
if(this.player&&this.player.active){this.player.setTexture(m.texture);this.player.setAngle(m.angle);this.tweens.add({targets:this.player,y:m.y,angle:m.angle,duration:320,ease:'Back.Out'});}
if(this.hudMode)this.hudMode.setText(m.name);
if(this.hudMode)this.hudMode.setColor('#'+COLORS[next].toString(16).padStart(6,'0'));
this.feedback('重力转换：'+m.name,true);this.nextHazardDistance=this.distance+320;
}
spawnHazard(){
let lane=Phaser.Math.Between(0,2);if(lane===this.lastLane)lane=(lane+Phaser.Math.Between(1,2))%3;this.lastLane=lane;
const mode=this.modeInfo(this.modeIndex);let dir=mode.dir;if(this.modeIndex===2)dir=Math.random()<.5?1:-1;
const y=dir>0?-75:H+75;const keys=['banana','pizza','helmet','fish','fly'];const key=keys[Phaser.Math.Between(0,keys.length-1)];
const x=[105,210,315][lane];const ring=this.track(this.add.circle(x,y,42,COLORS[Phaser.Math.Between(0,8)],.12));ring.setDepth(3);
const sprite=this.image(key,x,y,65,65,Phaser.Math.Between(-24,24));sprite.setDepth(4);
this.hazards.push({lane,y,dir,ring,sprite,hit:false});
}
updateRun(delta){
const dt=delta/1000;this.distance+=(this.quick?1.6:1)*dt*(160+Math.min(100,this.distance/125));
const speed=160+Math.min(100,this.distance/125);const mode=this.modeInfo(this.modeIndex);
if(this.hudDistance)this.hudDistance.setText('距离 '+Math.floor(this.distance/10)+'m');if(this.hudScore)this.hudScore.setText('分数 '+this.score);if(this.hudLives)this.hudLives.setText('♥ '.repeat(Math.max(0,this.lives)).trim()||'♡ ♡ ♡');
if(this.hudProgress)this.hudProgress.width=350*Math.min(1,this.distance/(this.finishAt||this.nextMiniAt||18000));
const wantedMode=this.modeForDistance();if(wantedMode!==this.modeIndex)this.switchMode(wantedMode);
const flow=this.modeInfo(this.modeIndex).dir;
for(const st of this.streaks){st.y+=flow*speed*dt*.68;if(st.y>700)st.y=215;if(st.y<215)st.y=700;}
if(this.player&&this.player.active){this.playerGlow.setPosition(this.player.x,this.player.y);this.playerGlow.setFillStyle(COLORS[this.modeIndex],this.time.now<this.dashUntil?.24:.09);if(this.time.now<this.invulnerableUntil)this.player.setAlpha(Math.floor(this.time.now/75)%2?.25:1);else this.player.setAlpha(1);}
if(this.distance>=this.nextHazardDistance){this.spawnHazard();this.nextHazardDistance+=Phaser.Math.Between(470,680);}
for(let i=this.hazards.length-1;i>=0;i--){const h=this.hazards[i];h.y+=h.dir*speed*dt*1.25;h.ring.y=h.y;h.sprite.y=h.y;h.sprite.angle+=h.dir*dt*55;h.ring.alpha=.08+Math.abs(Math.sin(this.time.now/150))*.12;
if(!h.hit&&h.lane===this.lane&&Math.abs(h.y-this.player.y)<48&&this.time.now>this.invulnerableUntil&&this.time.now>this.dashUntil){h.hit=true;this.hitObstacle(h);}
if(h.y>H+120||h.y< -120||h.hit){h.ring.destroy();h.sprite.destroy();this.hazards.splice(i,1);}}
if(this.distance>=this.nextMiniAt&&this.minisCompleted<EVENTS.length){this.beginMini(this.minisCompleted);return;}
if(this.minisCompleted>=EVENTS.length&&this.finishAt>0&&this.distance>=this.finishAt){this.showResults(true);return;}
}
hitObstacle(h){
this.lives--;this.combo=0;this.invulnerableUntil=this.time.now+1000;this.feedback('撞上了！'+(this.lives>0?'还剩 '+this.lives+' 次机会。':'跑酷结束！'),false);this.score=Math.max(0,this.score-80);
if(this.player){this.tweens.add({targets:this.player,x:this.player.x+12,duration:55,yoyo:true,repeat:3});this.player.setTint(0xff668c);this.time.delayedCall(280,()=>{if(this.player&&this.player.active)this.player.clearTint();});}
if(this.lives<=0)this.time.delayedCall(450,()=>this.showResults(false));
}
changeLane(dir){
if(this.phase!=='run'||!this.player)return;const next=Phaser.Math.Clamp(this.lane+dir,0,2);if(next===this.lane)return;
this.lane=next;this.tweens.add({targets:this.player,x:[105,210,315][next],duration:100,ease:'Quad.Out'});
const period=60000/this.currentBpm();let d=Math.abs(this.time.now-this.lastBeatMs);d=Math.min(d,Math.abs(period-d));
if(d<155){this.score+=50;this.combo++;this.bestCombo=Math.max(this.bestCombo,this.combo);this.feedback('踩拍换道！+50',true);this.capsuleBurst(this.player.x,this.player.y,COLORS[this.modeIndex]);}
